# ==============================================================================
# courier-management.conf - Production Nginx Reverse Proxy & Static Host
# ==============================================================================
# Location: /etc/nginx/conf.d/courier-management.conf
# ==============================================================================

server {
    listen 80;
    server_name 13-207-165-230.sslip.io;

    # Static React frontend
    root /var/www/courier-management;
    index index.html;

    # Client-side SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for Spring Boot REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Spring Boot Actuator health endpoint
    location /actuator/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
}