# ==============================================================================
# SwiftShip Courier Operations - Netlify Frontend Package Configuration
# ==============================================================================

[build]
  publish = "DBMS-DA3/frontend"
  functions = "DBMS-DA3/frontend/netlify/functions"
  command = "(test -d DBMS-DA3/frontend && cd DBMS-DA3/frontend && npm install) || npm install"

[functions]
  directory = "DBMS-DA3/frontend/netlify/functions"
  node_bundler = "esbuild"

# Route REST API requests directly to the Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api?route=/api/:splat"
  status = 200
  force = true

# Route Spring Boot style health check to the Netlify Serverless Function
[[redirects]]
  from = "/actuator/health"
  to = "/.netlify/functions/api?route=/actuator/health"
  status = 200
  force = true

# Standard security headers across all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
