# Application Name
spring.application.name=courier-management-system

# Server Configuration
server.port=${SERVER_PORT:8082}

# Neo4j Database Configuration
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:12345678}
spring.data.neo4j.database=neo4j

# Jackson JSON Configuration
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# CORS Configuration
courier.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.root=INFO
logging.level.com.courier=INFO
logging.level.org.springframework.data.neo4j=INFO
