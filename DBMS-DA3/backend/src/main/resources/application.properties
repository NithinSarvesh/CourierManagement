# Application Name
spring.application.name=courier-management-system

# Server Configuration (Supports Koyeb injected PORT, custom SERVER_PORT, and 8082 local default)
server.port=${PORT:${SERVER_PORT:8082}}
server.address=0.0.0.0

# Neo4j Database Configuration (Supports AuraDB neo4j+s:// and local bolt://)
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:12345678}
spring.data.neo4j.database=${NEO4J_DATABASE:neo4j}

# Jackson JSON Configuration
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# CORS Configuration (Production origins set via CORS_ALLOWED_ORIGINS)
courier.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8082}

# Actuator Endpoints for Deployment Health Monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.root=INFO
logging.level.com.courier=INFO
logging.level.org.springframework.data.neo4j=INFO
